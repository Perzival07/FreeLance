    <script>
      /* Apply the saved/system theme before first paint (prevents a day-to-night flash). */
      try {
        var t = localStorage.getItem('ev-theme');
        if (!t && document.documentElement.hasAttribute('data-default-night')) t = 'night';
        if (t === 'night') document.documentElement.dataset.theme = 'night';
      } catch (e) {}
      /* Hero intro: ink-bleed text renders blurred on first paint; JS resolves it. Failsafe removes it if JS never runs. */
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('intro');
        setTimeout(function () { document.documentElement.classList.remove('intro'); }, 7000);
      }
    </script>
    <noscript><style>html.intro .hero__name, html.intro .hero__eyebrow, html.intro .hero__tagline, html.intro .hero__ctas > *, html.intro .hero__cue { filter: none !important; opacity: 1 !important; }</style></noscript>
